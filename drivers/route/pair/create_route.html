<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font-family:sans-serif;padding:16px}.intro{opacity:.78;line-height:1.4}.name{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bbb;border-radius:8px;font-size:16px;margin:8px 0 14px}.bridge{display:flex;align-items:center;gap:10px;border:1px solid #ddd;border-radius:10px;padding:11px;margin:8px 0}.bridge input{width:20px;height:20px}.meta{font-size:13px;opacity:.7;margin-top:2px}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;cursor:pointer}#status{min-height:22px;margin:10px 0;opacity:.8}
</style></head><body>
<h2 id="title"></h2><p class="intro" id="intro"></p><input id="name" class="name"><div id="status"></div><div id="bridges"></div><button id="add" disabled></button>
<script>(function(){
const $=id=>document.getElementById(id), t=k=>Homey.__(k), name=$('name'), list=$('bridges'), status=$('status'), add=$('add');
$('title').textContent=t('route_pair.title'); $('intro').textContent=t('route_pair.intro'); name.placeholder=t('route_pair.placeholder'); add.textContent=t('route_pair.add');
let bridges=[]; function update(){add.disabled=!name.value.trim()||!document.querySelector('.bridge input:checked');}
async function load(){status.textContent=t('route_pair.loading'); try{bridges=await Homey.emit('list_bridges'); list.innerHTML=''; if(!bridges.length){status.textContent=t('route_pair.none');return;} status.textContent=''; for(const b of bridges){const row=document.createElement('label');row.className='bridge';const cb=document.createElement('input');cb.type='checkbox';cb.value=b.id;cb.onchange=update;const txt=document.createElement('div');const strong=document.createElement('div');strong.textContent=b.name;strong.style.fontWeight='600';const meta=document.createElement('div');meta.className='meta';meta.textContent=b.city||'';txt.append(strong,meta);row.append(cb,txt);list.appendChild(row);}update();}catch(e){status.textContent=(e&&e.message)||t('route_pair.load_failed');}}
add.onclick=async()=>{const ids=[...document.querySelectorAll('.bridge input:checked')].map(x=>x.value);add.disabled=true;status.textContent=t('route_pair.adding');try{const r=await Homey.emit('pair_route',{name:name.value.trim(),bridgeIds:ids});await Homey.createDevice(r.device);Homey.done();}catch(e){status.textContent=(e&&e.message)||t('route_pair.failed');update();}};
name.addEventListener('input',update);Homey.ready();load();})();</script></body></html>
