<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    :root{--brand:#0F667E;--ok:#26865b;--warn:#b87800;--bad:#b33b3b;--muted:#6f7780;--line:rgba(127,127,127,.22);--card:rgba(127,127,127,.06)}
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;padding:16px;line-height:1.4}
    header{margin-bottom:18px}.title{font-size:26px;font-weight:750;margin:0 0 4px}.subtitle{opacity:.72;margin:0}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:650}.primary{background:var(--brand);color:#fff}.secondary{background:var(--card);color:inherit;border:1px solid var(--line)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.card h3{margin:0 0 10px;font-size:17px}.row{display:flex;justify-content:space-between;gap:12px;margin:5px 0}.muted{opacity:.65}.small{font-size:12px}.status{font-weight:750}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
    .pill{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:650}.section{margin-top:24px}.section h2{font-size:20px;margin:0 0 10px}
    .history{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:70px;align-items:end;margin-top:10px}.bar{background:var(--brand);min-height:2px;border-radius:2px 2px 0 0;opacity:.75}.barlabels{display:flex;justify-content:space-between;font-size:10px;opacity:.55;margin-top:2px}
    details{margin-top:10px}summary{cursor:pointer;font-weight:650}.route-editor{display:grid;gap:6px;margin-top:8px}.check{display:flex;align-items:center;gap:8px}.check input{width:18px;height:18px}
    .diagnostics pre{white-space:pre-wrap;word-break:break-word;font-size:11px;max-height:320px;overflow:auto;background:rgba(0,0,0,.05);padding:10px;border-radius:8px}.empty{opacity:.62;padding:15px;text-align:center}.latest{font-size:12px;display:grid;gap:4px;margin-top:8px}.latest div{display:flex;justify-content:space-between;gap:8px}
    #message{min-height:18px;margin:8px 0;font-size:13px}.spin{opacity:.55;pointer-events:none}
  </style>
</head>
<body>
<header><h1 class="title" id="title"></h1><p class="subtitle" id="subtitle"></p></header>
<div class="toolbar"><button class="btn primary" id="refresh"></button><button class="btn secondary" id="reload"></button></div><div id="message"></div>

<section class="section"><h2 id="overviewTitle"></h2><div class="grid" id="overview"></div></section>
<section class="section"><h2 id="bridgesTitle"></h2><div class="grid" id="bridges"></div></section>
<section class="section"><h2 id="routesTitle"></h2><div class="grid" id="routes"></div></section>
<section class="section"><h2 id="nearbyTitle"></h2><div class="card"><button class="btn secondary" id="nearbyBtn"></button><div id="nearby"></div></div></section>
<section class="section diagnostics"><h2 id="diagTitle"></h2><div class="card"><pre id="diagnostics"></pre></div></section>

<script>
function onHomeyReady(Homey){
  const $=id=>document.getElementById(id), t=(key,fallback)=>{const v=Homey.__(key);return v===key?(fallback||key):v};
  const txt={
    title:t('settings.title','Brug Open Control Center'),subtitle:t('settings.subtitle','Live bruggen, routes, historie en databronnen in één overzicht.'),refresh:t('settings.refresh','Alles verversen'),reload:t('settings.reload','Overzicht herladen'),
    overview:t('settings.overview','Overzicht'),bridges:t('settings.bridges','Bruggen'),routes:t('settings.routes','Routes'),nearby:t('settings.nearby','Bruggen dichtbij Homey'),nearbyBtn:t('settings.nearby_button','Zoek bruggen dichtbij'),diag:t('settings.diagnostics','Diagnose'),
    loading:t('settings.loading','Laden…'),saved:t('settings.saved','Opgeslagen.'),none:t('settings.none','Geen gegevens'),edit:t('settings.edit_route','Bruggen beheren'),saveRoute:t('settings.save_route','Route opslaan'),
  };
  $('title').textContent=txt.title;$('subtitle').textContent=txt.subtitle;$('refresh').textContent=txt.refresh;$('reload').textContent=txt.reload;$('overviewTitle').textContent=txt.overview;$('bridgesTitle').textContent=txt.bridges;$('routesTitle').textContent=txt.routes;$('nearbyTitle').textContent=txt.nearby;$('nearbyBtn').textContent=txt.nearbyBtn;$('diagTitle').textContent=txt.diag;
  let snapshot=null;
  const api=(method,path,body)=>new Promise((resolve,reject)=>Homey.api(method,path,body||null,(err,result)=>err?reject(err):resolve(result)));
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const statusClass=s=>['open','blocked','queue','active','out_of_service'].includes(String(s))?'bad':['planned','announced','residual','restricted'].includes(String(s))?'warn':['closed','free','clear','ok','in_service','none'].includes(String(s))?'ok':'';
  const labelStatus=(group,value)=>{const v=String(value==null?'unknown':value);return t(`${group}.${v}`,v);};
  const date=s=>{if(!s)return '—';const d=new Date(s);return isNaN(d)?'—':d.toLocaleString([], {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});};
  const duration=sec=>{sec=Math.max(0,Number(sec)||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);return h?`${h}u ${m}m`:m?`${m}m ${s}s`:`${s}s`;};
  function bars(items){const vals=(items||[]).map(x=>Number(x.count)||0),max=Math.max(1,...vals);return `<div class="history">${vals.map(v=>`<div class="bar" title="${v}" style="height:${Math.max(3,100*v/max)}%"></div>`).join('')}</div><div class="barlabels"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>`;}
  function historyHtml(h,kind){if(!h)return '';const latest=(h.latest||[]).map(x=>`<div><span>${date(x.start)}</span><strong>${duration(x.durationSeconds)}</strong></div>`).join('');return `<details><summary>${esc(t('settings.history','Historie & patroon'))}</summary>${bars(h.byHour)}<div class="small muted">${kind==='route'?esc(t('settings.route_measurement','Lokale routeblokkades sinds')):esc(t('settings.bridge_measurement','Lokale openingen sinds'))}: ${esc(date(h.measurementStartedAt))}</div><div class="latest">${latest||`<div>${esc(txt.none)}</div>`}</div></details>`;}
  function render(){
    if(!snapshot)return;
    $('overview').innerHTML=`<div class="card"><h3>${esc(t('settings.current','Actueel'))}</h3><div class="row"><span>${esc(t('settings.bridge_count','Bruggen'))}</span><strong>${snapshot.bridges.length}</strong></div><div class="row"><span>${esc(t('settings.route_count','Routes'))}</span><strong>${snapshot.routes.length}</strong></div><div class="row"><span>${esc(t('settings.open_now','Nu open'))}</span><strong>${snapshot.bridges.filter(b=>b.status==='open').length}</strong></div><div class="row"><span>${esc(t('settings.blocked_routes','Geblokkeerde routes'))}</span><strong>${snapshot.routes.filter(r=>r.status==='blocked').length}</strong></div></div>`;
    $('bridges').innerHTML=snapshot.bridges.length?snapshot.bridges.map(b=>`<article class="card"><h3>${esc(b.name)}</h3><div class="small muted">${esc(b.city||b.id)}</div><div class="row"><span>${esc(t('settings.bridge_status','Brugstatus'))}</span><span class="status ${statusClass(b.status)}">${esc(labelStatus('status',b.status))}</span></div><div class="row"><span>${esc(t('settings.next_opening','Volgende opening'))}</span><strong>${esc(b.nextOpening)}</strong></div><div class="row"><span>${esc(t('settings.open_duration','Openingsduur'))}</span><strong>${esc(b.openDuration)}</strong></div><div class="row"><span>${esc(t('settings.traffic','Gevolg brugopening'))}</span><span class="status ${statusClass(b.trafficStatus)}">${esc(labelStatus('traffic_status',b.trafficStatus))}</span></div><div class="small">${esc(b.trafficSummary||'')}</div><div class="row"><span>${esc(t('settings.queue_length','Filelengte door opening'))}</span><strong>${Number(b.queueLengthKm||0).toFixed(1).replace('.',',')} km</strong></div>${b.trafficStatus==='residual'?`<div class="row"><span>${esc(t('settings.aftermath','Afwikkeltijd na sluiten'))}</span><strong>${esc(b.aftermathDuration||'—')}</strong></div>`:''}${historyHtml(b.history,'bridge')}</article>`).join(''):`<div class="empty">${esc(txt.none)}</div>`;
    $('routes').innerHTML=snapshot.routes.length?snapshot.routes.map(r=>{const checks=snapshot.bridges.map(b=>`<label class="check"><input type="checkbox" data-route="${esc(r.id)}" value="${esc(b.id)}" ${r.bridgeIds.includes(b.id)?'checked':''}><span>${esc(b.name)}</span></label>`).join('');return `<article class="card"><h3>${esc(r.name)}</h3><div class="row"><span>${esc(t('settings.route_status','Routestatus'))}</span><span class="status ${statusClass(r.status)}">${esc(labelStatus('route_status',r.status))}</span></div><div class="small">${esc(r.summary||'')}</div><div class="row"><span>${esc(t('settings.traffic','Gevolg brugopening'))}</span><span class="status ${statusClass(r.trafficStatus)}">${esc(labelStatus('traffic_status',r.trafficStatus))}</span></div><div class="small">${esc(r.trafficSummary||'')}</div><div class="row"><span>${esc(t('settings.queue_length','Filelengte door opening'))}</span><strong>${Number(r.queueLengthKm||0).toFixed(1).replace('.',',')} km</strong></div>${r.trafficStatus==='residual'?`<div class="row"><span>${esc(t('settings.aftermath','Afwikkeltijd na sluiten'))}</span><strong>${esc(r.aftermathDuration||'—')}</strong></div>`:''}<div class="row"><span>${esc(t('settings.blockages_today','Blokkades vandaag'))}</span><strong>${esc(r.blockagesToday)}</strong></div><div class="row"><span>${esc(t('settings.blocked_time_today','Blokkadetijd vandaag'))}</span><strong>${esc(r.blockedTimeToday)}</strong></div><details><summary>${esc(txt.edit)}</summary><div class="route-editor">${checks}</div><button class="btn primary save-route" data-id="${esc(r.id)}">${esc(txt.saveRoute)}</button></details>${historyHtml(r.history,'route')}</article>`;}).join(''):`<div class="empty">${esc(txt.none)}</div>`;
    document.querySelectorAll('.save-route').forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.id,ids=[...document.querySelectorAll('input[data-route]')].filter(x=>x.dataset.route===id&&x.checked).map(x=>x.value);try{busy(true);await api('PUT',`/routes/${encodeURIComponent(id)}`,{bridgeIds:ids});message(txt.saved);await load();}catch(e){Homey.alert((e&&e.message)||String(e));}finally{busy(false);}});
    $('diagnostics').textContent=JSON.stringify(snapshot.diagnostics,null,2);
  }
  function message(m){$('message').textContent=m||'';setTimeout(()=>{if($('message').textContent===m)$('message').textContent='';},4000);}
  function busy(on){document.body.classList.toggle('spin',!!on);}
  async function load(){try{snapshot=await api('GET','/dashboard');render();}catch(e){Homey.alert((e&&e.message)||String(e));}}
  $('reload').onclick=()=>load();
  $('refresh').onclick=async()=>{try{busy(true);message(t('settings.refreshing','Bronnen verversen…'));await api('POST','/refresh',{});await load();message(t('settings.refreshed','Verversing voltooid.'));}catch(e){Homey.alert((e&&e.message)||String(e));}finally{busy(false);}};
  $('nearbyBtn').onclick=async()=>{try{busy(true);const list=await api('GET','/nearby?limit=12');$('nearby').innerHTML=(list||[]).map((b,i)=>`<div class="row"><span>${i+1}. ${esc(b.name)} <span class="muted small">${esc(b.city||'')}</span></span><strong>${Number.isFinite(Number(b.distanceMeters))?`${(Number(b.distanceMeters)/1000).toFixed(1).replace('.',',')} km`:''}</strong></div>`).join('')||`<div class="empty">${esc(txt.none)}</div>`;}catch(e){Homey.alert((e&&e.message)||String(e));}finally{busy(false);}};
  Homey.on('dashboard_changed',()=>{clearTimeout(window.__boReload);window.__boReload=setTimeout(load,800);});
  Homey.ready();load();
}
</script>
</body>
</html>
